name: Build & Release

# Every push to main builds everything and keeps the files as workflow artifacts.
# Pushing a tag like v1.0.0 also puts them all on a draft GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.arch }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force tauri-cli@^2
      - name: Build .deb .rpm .AppImage
        working-directory: src-tauri
        env:
          NO_STRIP: 'true' # linuxdeploy's bundled strip can't read newer binaries
        run: cargo tauri build --bundles deb,rpm,appimage
      - name: Collect files
        run: |
          V=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p out
          B=src-tauri/target/release/bundle
          cp $B/deb/*.deb $B/rpm/*.rpm $B/appimage/*.AppImage out/
          mkdir -p tar/afterglow-$V && cp src-tauri/target/release/afterglow tar/afterglow-$V/
          cp src-tauri/icons/128x128@2x.png tar/afterglow-$V/afterglow.png
          tar -C tar -czf out/Afterglow_${V}_linux_${{ matrix.arch }}.tar.gz afterglow-$V
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Afterglow-Linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-${{ matrix.arch }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force tauri-cli@^2
      - name: Build installer
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then BUNDLES=nsis,msi; else BUNDLES=nsis; fi
          cargo tauri build --target ${{ matrix.target }} --bundles $BUNDLES
      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          cp $B/nsis/*.exe out/
          cp $B/msi/*.msi out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Afterglow-Windows-${{ matrix.arch }}
          path: out/*

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            fp: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            fp: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Afterglow-Linux-${{ matrix.arch }}
          path: linux
      - name: Stage files
        run: |
          tar -xzf linux/*.tar.gz -C linux
          cp linux/afterglow-*/afterglow packaging/flatpak/afterglow
          cp src-tauri/icons/128x128@2x.png packaging/flatpak/icon.png
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/dev.misalovesjapuszko.afterglow.yml
          bundle: Afterglow_linux_${{ matrix.arch }}.flatpak
          arch: ${{ matrix.fp }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: Afterglow-Flatpak-${{ matrix.arch }}
          path: Afterglow_linux_${{ matrix.arch }}.flatpak

  ios:
    name: iOS
    uses: ./.github/workflows/ios.yml

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [linux, flatpak, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Afterglow ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: files/*
