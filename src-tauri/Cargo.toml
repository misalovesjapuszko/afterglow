[package]
name = "afterglow"
version = "1.0.0"
edition = "2021"
default-run = "afterglow"

[lib]
name = "afterglow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-glassbar = { path = "plugins/glassbar" }
serde_json = "1"
ureq = "3"
open = "5"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# librespot pulls in sysinfo, which doesn't build for iOS; on iPhone Afterglow is a remote anyway
[target.'cfg(not(target_os = "ios"))'.dependencies]
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-audio = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

# real visualizer on Windows: WASAPI loopback capture
[target.'cfg(windows)'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10.0", features = ["tokio"] }
